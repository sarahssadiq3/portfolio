<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sarah Sadiq · Software Engineer</title>
    <meta name="description" content="Portfolio of Sarah Sadiq, Software Engineer — work experience, projects, and contact information." />
    <meta property="og:title" content="Sarah Sadiq · Software Engineer" />
    <meta property="og:description" content="Work experience, projects, and contact information." />
    <meta property="og:type" content="website" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%232563eb'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='system-ui'>&lt;/&gt;</text></svg>" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header">
      <nav class="nav container" aria-label="Primary">
        <a class="nav-brand" href="#top" data-bind="name"></a>
        <ul class="nav-links">
          <li><a href="#experience">Experience</a></li>
          <li><a href="#projects">Projects</a></li>
          <li><a href="#skills">Skills</a></li>
          <li><a href="#contact">Contact</a></li>
        </ul>
        <button class="theme-toggle" type="button" aria-label="Toggle dark mode">
          <span aria-hidden="true">◐</span>
        </button>
      </nav>
    </header>

    <main id="main">
      <section id="top" class="hero container">
        <p class="availability" data-bind="availability"></p>
        <h1 class="hero-name" data-bind="name"></h1>
        <p class="hero-title">
          <span data-bind="title"></span>
          <span class="dot" aria-hidden="true">·</span>
          <span data-bind="location"></span>
        </p>
        <p class="hero-summary" data-bind="summary"></p>
        <div class="hero-actions" id="hero-actions"></div>
      </section>

      <section id="experience" class="section container" aria-labelledby="experience-h">
        <h2 id="experience-h" class="section-title">Experience</h2>
        <ol class="timeline" id="experience-list"></ol>
      </section>

      <section id="projects" class="section container" aria-labelledby="projects-h">
        <h2 id="projects-h" class="section-title">Projects</h2>
        <div class="project-grid" id="project-list"></div>
      </section>

      <section id="skills" class="section container" aria-labelledby="skills-h">
        <h2 id="skills-h" class="section-title">Skills</h2>
        <div class="skills" id="skill-list"></div>
      </section>

      <section id="education" class="section container" aria-labelledby="education-h">
        <h2 id="education-h" class="section-title">Education</h2>
        <div id="education-list" class="edu-list"></div>
      </section>

      <section id="certifications" class="section container" aria-labelledby="cert-h">
        <h2 id="cert-h" class="section-title">Certifications</h2>
        <ul id="cert-list" class="edu-list"></ul>
      </section>

      <section id="contact" class="section container contact" aria-labelledby="contact-h">
        <h2 id="contact-h" class="section-title">Let's talk</h2>
        <p>I'm happy to chat about roles, teams, or anything on this page.</p>
        <div class="hero-actions" id="contact-actions"></div>
      </section>
    </main>

    <footer class="site-footer container">
      <p>© <span id="year"></span> <span data-bind="name"></span></p>
    </footer>

    <script src="js/content.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
